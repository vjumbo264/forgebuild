name: Temp Copy Secrets
on:
  workflow_dispatch:
    inputs:
      target_repo:
        description: 'Target repo'
        required: true
        default: 'vjumbo264/forgehouse50-android'

jobs:
  copy_secrets:
    runs-on: ubuntu-latest
    steps:
      - name: Copy signing secrets to new repo
        env:
          GH_TOKEN: ${{ secrets.SYNC_PAT }}
          KS_B64: ${{ secrets.KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          K_ALIAS: ${{ secrets.KEY_ALIAS }}
          K_PASS: ${{ secrets.KEY_PASSWORD }}
          TARGET: ${{ github.event.inputs.target_repo }}
        run: |
          set -e
          echo "Copying signing secrets into $TARGET..."
          printf '%s' "$KS_B64" | gh secret set KEYSTORE_BASE64 -R "$TARGET"
          printf '%s' "$KS_PASS" | gh secret set KEYSTORE_PASSWORD -R "$TARGET"
          printf '%s' "$K_ALIAS" | gh secret set KEY_ALIAS -R "$TARGET"
          printf '%s' "$K_PASS" | gh secret set KEY_PASSWORD -R "$TARGET"
          echo "Secrets copied successfully."
