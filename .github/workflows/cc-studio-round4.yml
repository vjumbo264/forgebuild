name: CC Studio Round 4 prerelease

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cc-studio-round4-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/cc-studio
    env:
      TAG: cc-studio-v10-rc${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Set monotonically increasing version
        run: echo "VERSION_CODE=$((1000 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"
      - name: Verify plugin and build signed APKs
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_BASE64"
          mkdir -p keystore dist
          (umask 077; printf '%s' "$KEYSTORE_BASE64" | base64 -d > keystore/release.jks)
          trap 'rm -f keystore/release.jks' EXIT
          chmod +x gradlew
          ./gradlew :core:test :core:generateGojoPlugin :app:assembleRelease --no-daemon \
            -PccAbiSplits=true -PforgebuildVersionCode="$VERSION_CODE" -PforgebuildVersionName="1.0.$VERSION_CODE"
          python3 tools/kfplug_build.py core/build/gojo-plugin/tree /tmp/validator.kfplug
          python3 tools/verify_cc_archive.py core/build/gojo-plugin/motionsalt.cc.kfplug /tmp/validator.kfplug
          cp core/build/gojo-plugin/motionsalt.cc.kfplug dist/
          for abi in universal arm64-v8a armeabi-v7a x86 x86_64; do
            cp "app/build/outputs/apk/release/app-$abi-release.apk" "dist/cc-studio-$abi.apk"
          done
      - name: Compare signing certificate with v9
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner |sort -V|tail -1)
          gh release download cc-studio-v9 -p 'app-cc-studio-v9.apk' -O /tmp/previous.apk
          fingerprint() { "$APKSIGNER" verify --print-certs "$1" | sed -n 's/.*certificate SHA-256 digest: //p' | sort; }
          previous=$(fingerprint /tmp/previous.apk)
          for apk in dist/*.apk; do
            current=$(fingerprint "$apk")
            test -n "$current" && test "$current" = "$previous"
          done
          echo 'All APK signatures match the cc-studio-v9 signing certificate.'
          (cd dist; sha256sum *.apk *.kfplug > SHA256SUMS.txt)
      - name: Publish prerelease and verify downloaded files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$TAG" dist/* --target "$GITHUB_SHA" --prerelease --title "CC Studio Round 4 — $TAG" \
            --notes "Round 4 candidate, version 1.0.$VERSION_CODE. Signed with the same certificate as v9. Includes the API 1 Gojo sample. Automated build and format checks passed; phone and Keyflaw acceptance are not claimed."
          mkdir -p /tmp/cc-release-back
          gh release download "$TAG" --dir /tmp/cc-release-back
          (cd /tmp/cc-release-back; sha256sum -c SHA256SUMS.txt)
