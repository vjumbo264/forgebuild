name: "MOTIONSALT CC Studio Tests & Offline Verification"

on:
  push:
    paths:
      - "apps/cc-studio/**"
      - ".github/workflows/cc-studio-tests.yml"
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Offline Manifest Enforcement Check
        run: |
          MANIFEST="apps/cc-studio/app/src/main/AndroidManifest.xml"
          if grep -iE 'permission.*(INTERNET|ACCESS_NETWORK_STATE)' "$MANIFEST"; then
            echo "CRITICAL SECURITY VIOLATION: Offline app declares network permissions!"
            exit 1
          fi
          echo "Offline manifest check PASSED: zero network permissions found."

      - name: Zero-Stubs Enforcement Check
        run: |
          echo "Scanning apps/cc-studio/app/src/main/java/ and core/ for stubs or empty handlers..."
          STUB_MATCHES=$(grep -rnE '(TODO|stub|placeholder|not implemented|onClick\s*=\s*\{\s*\})' \
            apps/cc-studio/app/src/main/java/ \
            apps/cc-studio/core/src/main/ || true)
          if [ -n "$STUB_MATCHES" ]; then
            echo "FAILED: Found stubs or empty onClick handlers:"
            echo "$STUB_MATCHES"
            exit 1
          fi
          echo "Zero-Stubs Check PASSED: No stubs or empty handlers found."

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Run JVM Unit Tests
        run: |
          cd apps/cc-studio
          chmod +x gradlew
          ./gradlew :core:test :app:testDebugUnitTest --no-daemon

      - name: Build Debug APK
        run: |
          cd apps/cc-studio
          ./gradlew :app:assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cc-studio-pivot-validation
          path: |
            apps/cc-studio/core/build/reports/tests/test/
            apps/cc-studio/app/build/outputs/apk/debug/*.apk
